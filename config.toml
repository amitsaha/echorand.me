baseURL = "https://echorand.me"
languageCode = "en-us"
title = "Explorations - computing, research, etc."
theme = "etch"
googleAnalytics = "UA-108901610-1"
enableGitInfo = true
lastmod = ["lastmod", ":fileModTime", ":default"]

[markup.goldmark.renderer]
    unsafe= true

[markup.highlight]
    style = "gruvbox"
    noClasses = true

[security]
  enableInlineShortcodes = false
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', '^rst2html$']
    osEnv = ['(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$']
  [security.funcs]
    getenv = ['^HUGO_']
  [security.http]
    methods = ['(?i)GET|POST']
    urls = ['.*']

[params]
  description = "echo $RANDOM. Exploring Software and writing about it."
  mainSection = "posts"
  showAllPostsOnHomePage = true
  postsOnHomePage = 20 
  tagsOverview = true
  showProjectsList = false
  show_updated = true
  rss = true
  dark = "auto"

[[params.social]]
  name = "github"
  link = "https://github.com/amitsaha"

[[params.social]]
  name = "email"
  link = "amitsaha.in@gmail.com" # no need for "mailto:" at the start

[[params.social]]
  name = "linkedin"
  link = "https://www.linkedin.com/in/echorand/"

[taxonomies]
  category = "categories"
  tag = "tags"

[[menu.main]]
